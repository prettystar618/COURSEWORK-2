      font-size:22px;

      position:relative;
    }
    .form-box h2::after{
      content:'';
      width:50px;
      height:3px;
      background:#ff5c00;
      display:block;
      margin:10px auto 0;
      border-radius:3px;
    }
    input, select{
      width:100%;
      padding:13px;
      margin:12px 0;
      border:1px solid #eee;
      border-radius:8px;
      background:#fafafa;
      font-size:15px;
      transition:0.3s;
    }
    input:focus, select:focus{
      outline:none;
      border-color:#ff5c00;
      background:white;
      box-shadow:0 0 0 3px rgba(255,92,0,0.1);
    }
    button{
      background:linear-gradient(90deg, #ff5c00, #ff7a2f);
      color:white;
      border:none;
      padding:15px;
      width:100%;
      border-radius:8px;
      cursor:pointer;
      margin-top:15px;
      font-size:16px;
      font-weight:bold;
      transition:0.3s;
      box-shadow:0 3px 10px rgba(255,92,0,0.2);
    }
    button:hover{
      transform:translateY(-2px);
      box-shadow:0 5px 15px rgba(255,92,0,0.3);
    }
    .year-trigger {
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #333;
      font-size:15px;
      transition:0.3s;
    }
    .year-trigger:focus-within{
      border-color:#ff5c00;
      background:white;
    }
    .year-trigger::after {
      content: '▼';
      font-size: 12px;
      color: #666;
      transition: 0.2s;
    }
    .year-trigger.active::after {
      transform: rotate(180deg);
    }
    .year-grid {
      display: none;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      padding: 15px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 12px;
      background:#fafafa;
    }
    .year-grid.show {
      display: grid;
    }
    .year-item {
      padding: 10px 5px;
      text-align: center;
      border: 1px solid #eee;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size:15px;
      background:white;
    }
    .year-item:hover{background: #fff0e6;}
    .year-item.active {
      background: #ff5c00; 
      color: white; 
      border-color: #ff5c00;
      font-weight:bold;
    }

      background:#fafafa;

    }

      color: #666;

<script>
  const yearTrigger = document.getElementById('yearTrigger');
  const yearGrid = document.getElementById('yearGrid');
  const selectedYear = document.getElementById('selectedYear');
  const submitBtn = document.getElementById('submitBtn');
  const startYear = 2025;
  const endYear = 1970;

  yearTrigger.addEventListener('click', () => {
    yearGrid.classList.toggle('show');
    yearTrigger.classList.toggle('active');
  });

  for (let year = startYear; year >= endYear; year--) {
    const item = document.createElement('div');
    item.className = 'year-item';
    item.textContent = year;
    
    item.addEventListener('click', () => {
      document.querySelectorAll('.year-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      selectedYear.value = year;
      yearGrid.classList.remove('show');
      yearTrigger.classList.remove('active');
      yearTrigger.querySelector('span').textContent = `Year: ${year}`;
    });
    
    yearGrid.appendChild(item);
  }

  submitBtn.addEventListener('click', (e) => {
    const rangeInput = document.getElementById('priceRange').value.trim();
    const [minStr, maxStr] = rangeInput.split('-').map(item => item.trim());
    const minPrice = Number(minStr);
    const maxPrice = Number(maxStr);

    if (!minStr || !maxStr || isNaN(minPrice) || isNaN(maxPrice)) {
      e.preventDefault();
      alert('Please enter a valid price range! Format: Min Price - Max Price');
      return;
    }
    if (minPrice < 100 || maxPrice < 100) {
      e.preventDefault();
      alert('Price cannot be less than 100!');
      return;
    }
    if (minPrice >= maxPrice) {
      e.preventDefault();
      alert('Minimum Expected Price must be less than Maximum Expected Price!');
    }
  });
</script>
